<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>競賽 — HINO iTRAQ</title>
<link rel="stylesheet" href="../main.css">
</head>
<body class="lead">
<header class="appbar">
  <div class="bar-inner">
    <div class="logo">iTRAQ</div>
    <div class="ttl" id="ttl">競賽</div>
    <button type="button" class="role-fab" id="regionFab" popovertarget="regionPop">區域</button>
    <a class="back" href="../../../index.html">返回</a>
  </div>
</header>
<main class="screen">
  <section class="dash-top">
    <p class="period" id="period"></p><p class="period">歷史車號指標 Demo，非官方駕駛成績；區域為 GPS 展示分組，缺測月份不參與比較。</p>
    <div class="score-row">
      <div class="score-card">
        <div class="k">本區平均</div>
        <div class="v" id="scoreVal">—</div>
        <div class="s" id="scoreLabel"></div>
        <div class="s" id="scoreDelta"></div>
      </div>
      <div class="score-card">
        <div class="k">表現一般</div>
        <div class="v" id="rankVal">—</div>
        <div class="s" id="rankOf"></div>
      </div>
      <div class="chartcard">
        <div class="ch-h"><span class="ttl" id="chartTitle">月趨勢</span><span class="sub" id="chartSub"></span></div>
        <div id="chart"></div>
      </div>
    </div>
    <aside class="ai-brief" id="aiBrief"></aside>
    <div class="drv-grid" id="drivers"></div>
  </section>
  <nav class="dash-tabs" id="tabs"></nav>
</main>
<div id="regionPop" popover class="role-pop"></div>
<dialog class="drawer" id="drawer">
  <div class="drawer-hd">
    <strong id="drawerTitle"></strong>
    <button type="button" class="ai-x" id="drawerClose">關閉</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <nav class="dash-tabs" id="drawerTabs"></nav>
</dialog>
<script src="../../../excel-derived-data.js"></script>
<script src="../score.js"></script>
<script src="main.js"></script>
</body>
</html>
